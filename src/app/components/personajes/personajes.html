<ul>
  @for (personaje of personajes; track personaje.nombre) {
    <li>
      <h3>{{ personaje.nombre }}</h3>
      <p>{{ personaje.descripcion }}</p>
      
      @if (personaje.like) {
        👍
      }
      
      <br>
      <img [src]="personaje.imagen" [alt]="personaje.nombre" width="100">
    </li>
  }
</ul>
